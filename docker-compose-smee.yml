# Local development only: forwards a smee.io channel to a bot running on the host.
services:
  smee:
    image: node:lts-alpine
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "npm install -g smee-client &&
             smee --url ${SMEE_URL} --target http://host.docker.internal:5050/webhook"