# Local development only: forwards a smee.io channel to the bot published on the host.
services:
  smee:
    image: node:lts-alpine
    restart: always
    network_mode: host
    command: >
      sh -c "npm install -g smee-client &&
             smee --url ${SMEE_URL} --target http://127.0.0.1:5000/webhook"
